name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; a newer run replaces an in-progress one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 runs the AI assistant's TypeScript directly (no build step).
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Local open-source LLM for the AI assistant tests: free, no API key.
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          curl -sf http://localhost:11434/api/version || (ollama serve > /dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull qwen2.5:1.5b

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Publish the report even when tests fail, so the live page always shows
      # the latest run on main.
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
