# Local n8n that receives test results and sends them to Telegram.
#   cp .env.example .env   (fill in the Telegram values)
#   docker compose up -d   → http://localhost:5678
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
    environment:
      - GENERIC_TIMEZONE=Africa/Tunis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Lets the workflow read the two Telegram values above.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:
